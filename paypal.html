<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Payment | MassiveShift College Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #07152d 0%, #0d2348 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .payment-container { background: white; border-radius: 24px; padding: 40px; max-width: 450px; width: 100%; text-align: center; }
        .paypal-btn { background: #0070BA; color: white; padding: 16px; border-radius: 12px; border: none; font-weight: 700; width: 100%; cursor: pointer; margin: 20px 0; font-size: 16px; }
        .paypal-btn:hover { background: #005c99; transform: translateY(-2px); transition: all 0.3s; }
        .btn { background: #07152d; color: white; padding: 16px; border-radius: 12px; border: none; font-weight: 700; width: 100%; cursor: pointer; margin-top: 12px; font-size: 16px; transition: all 0.3s; }
        .btn:hover { background: #0d2348; transform: translateY(-2px); }
        .amount { font-size: 32px; font-weight: 700; margin: 20px 0; color: #f39c12; }
        h1 { color: #07152d; }
    </style>
</head>
<body>
    <div class="payment-container">
        <i class="fab fa-paypal" style="font-size: 64px; color: #0070BA;"></i>
        <h1>PayPal Payment</h1>
        <div class="amount" id="amountDisplay">$15 USD</div>
        <p>Pay securely with your PayPal account</p>
        <button class="paypal-btn" id="paypalBtn"><i class="fab fa-paypal"></i> Pay with PayPal</button>
        <button class="btn" id="cancelBtn">Cancel</button>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '15';
        const currency = urlParams.get('currency') || 'USD';
        const applicantName = decodeURIComponent(urlParams.get('name') || 'Applicant');
        const applicantEmail = decodeURIComponent(urlParams.get('email') || '');
        
        const displayAmount = currency === 'ZMW' ? `ZK${amount}` : `$${amount}`;
        document.getElementById('amountDisplay').innerText = displayAmount;
        
        // Update this with your actual PayPal business email
        const PAYPAL_EMAIL = 'admin@massiveshift.academy';
        
        document.getElementById('paypalBtn').onclick = () => {
            window.open(`https://www.paypal.com/send?business=${PAYPAL_EMAIL}&amount=${amount}&currency_code=${currency}`, '_blank');
            setTimeout(() => {
                if(confirm('After completing payment, click OK to continue')) {
                    localStorage.setItem('applicationFeePaid', 'true');
                    window.location.href = '../index.html?payment=success';
                }
            }, 5000);
        };
        
        document.getElementById('cancelBtn').onclick = () => window.location.href = '../index.html';
    </script>
</body>
</html>
